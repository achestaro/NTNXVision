[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ntnxvision-core"
version = "0.3.0"
description = "Inventory & documentation core for Nutanix Prism Central (NTNXVision)"
readme = "README.md"
# Cap the upper bound: brand-new Python releases (e.g. 3.14) often lack prebuilt wheels
# for pydantic-core/lxml, which forces pip into a long backtracking search that can end
# in ResolutionImpossible. 3.10–3.13 all have wheels for every runtime dep.
requires-python = ">=3.10,<3.14"
authors = [{ name = "Alberto Chestaro" }]
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Private :: Do Not Upload",  # PyPI rejects this classifier: the core ships only inside the app
]

# Runtime dependencies only — small and wheel-only (no native build tools required).
# Install with `pip install -e .` (NOT `.[dev]`) to run the app.
dependencies = [
    "requests>=2.31,<3",     # v3 / v2 REST fallback + NDB Era API
    "urllib3>=2.0,<3",
    "pydantic>=2.6,<3",      # normalized, version-independent data model
    "typer>=0.12,<1",        # CLI / sidecar entrypoint
    "rich>=13.7,<15",        # pretty CLI output & progress
    "openpyxl>=3.1,<4",      # Excel export
    "fpdf2>=2.7,<3",         # PDF export — pure Python, no native GTK/Pango deps
    "python-docx>=1.1,<2",   # Word Architecture Design Document
    "pillow>=10.1,<13",      # topology diagram rendering (also required by fpdf2)
]

[project.optional-dependencies]
# Official Nutanix v4 Python SDKs (per-namespace). Installed as coverage grows.
ntnx-v4 = [
    "ntnx-clustermgmt-py-client",
    "ntnx-vmm-py-client",
    "ntnx-networking-py-client",
    "ntnx-storage-py-client",
    "ntnx-volumes-py-client",
    "ntnx-dataprotection-py-client",
    "ntnx-microseg-py-client",
    "ntnx-files-py-client",
    "ntnx-objects-py-client",
    "ntnx-iam-py-client",
    "ntnx-lifecycle-py-client",
    "ntnx-licensing-py-client",
    "ntnx-monitoring-py-client",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.9",
    "types-requests",
    "types-openpyxl",
    "pyinstaller>=6.5",      # freeze the sidecar for packaging
    "pip-licenses>=5.0",     # THIRD_PARTY_NOTICES.md (scripts/third_party_python.py)
]

[project.scripts]
ntnxvision = "ntnxvision_core.__main__:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["ntnxvision_core*"]

# The PDF report embeds these OFL fonts (Figtree, Montserrat Light, JetBrains Mono); each
# ships next to its license text.
[tool.setuptools.package-data]
"ntnxvision_core.exporters" = ["fonts/*.ttf", "fonts/OFL-*.txt"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
