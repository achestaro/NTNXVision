version: 2
# One grouped PR per ecosystem per week, so each week's updates cost one CI run.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    # 1.3.0 to 2.1.2 store an empty credential on Windows (the packaged smoke test's
    # keychain round trip fails); stay on 1.2.0 until a release passes it.
    ignore:
      - dependency-name: "@napi-rs/keyring"
  - package-ecosystem: pip
    directory: /core
    schedule:
      interval: weekly
    groups:
      pip:
        patterns: ["*"]
