version: 2
# One grouped PR per ecosystem per week, so each week's updates cost one CI run.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /core
    schedule:
      interval: weekly
    groups:
      pip:
        patterns: ["*"]
