name: Release

# Builds the Windows MSI and the macOS DMG/ZIP (arm64 + x64) with the one-command build
# scripts, smoke-tests the frozen sidecar and the packaged app on each OS, and uploads the
# installers. Tags (v*) additionally get a draft GitHub Release with every installer, a
# SHA256SUMS file and a build-provenance attestation.
#
# Runs only on pull requests into main (to catch issues before the merge), on release
# tags, and on demand (Actions > Release > Run workflow). Pushes to feature branches
# do not run it.
#
# Security model: the workflow token is read-only by default; only the `release` job (tags
# only) gets contents: write. Signing secrets live in the `release` Environment (restricted
# to v* tags) and are exposed only to tag builds, never to pull requests or manual runs, and
# a tag build fails if any signing secret is missing. Every action is
# pinned by commit SHA (Dependabot keeps them current). Python build deps are installed from
# the hash-locked core/requirements-build.lock with --require-hashes.

on:
  pull_request:
    branches: ["main"]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  checks:
    name: Core tests + app lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0   # the version check diffs against the base branch
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: core/requirements-build.lock
      - name: pytest
        working-directory: core
        run: |
          python -m pip install --require-hashes -r requirements-build.lock
          python -m pip install --no-deps -e .
          python -m pytest -q
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: eslint
        working-directory: app
        run: |
          npm ci --ignore-scripts --no-audit --no-fund   # lint needs no native module
          npm run lint
      # Shipped code changed: the version must go up (and CHANGELOG.md must say why), so
      # every installed build tells which fixes and features it has. Dependabot PRs exempt.
      - name: Version raised for shipped changes
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-version-bump.mjs "origin/$BASE_REF"
      # Shipped (production) dependencies must have no high or critical advisories.
      - name: npm audit (production, high)
        working-directory: app
        run: npm audit --omit=dev --audit-level=high
      # The --omit=dev audit above skips electron itself (a devDependency, but shipped inside
      # the app), so the full tree is audited too, blocking at moderate. This relies on the
      # package.json override that removes the last moderate chain (global-agent): merge this
      # change after it, or this step fails on a tree that still has that advisory.
      - name: npm audit (full tree, moderate)
        working-directory: app
        run: npm audit --audit-level=moderate
      # Python deps float within ranges, so a new upstream release can legitimately drift the
      # file; flag it here (non-blocking). Each build regenerates the copy it ships.
      - name: Third-party notices up to date
        working-directory: app
        continue-on-error: true
        env:
          NTNXVISION_PYTHON: python
        run: npm run notices:check

  # Known-vulnerability scan of every platform's pins in the hash-locked Python set that is
  # frozen into the sidecar. The lock holds per-platform pins (environment markers), and
  # pip-audit would evaluate the markers for this Ubuntu runner only, so the markers are
  # stripped and each distinct pin is audited. A package pinned twice (cryptography, fonttools)
  # is split across files because pip-audit rejects duplicate requirements in one file.
  # Fails on any advisory except the accepted blockers below.
  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install pip-audit==2.10.1
      - name: pip-audit (all platform pins)
        run: |
          # name==version only: markers, hashes and comments dropped.
          grep -E '^[A-Za-z0-9_.-]+==' core/requirements-build.lock \
            | sed -E 's/^([^ ]+==[^ ]+).*/\1/' > pins.txt
          mkdir pins
          awk -F'==' '{ n[$1]++; print > ("pins/req-" n[$1] ".txt") }' pins.txt
          # Accepted blockers (B-2): the Intel macOS pin cryptography==48.0.1 is affected by
          # these three advisories (fixed in 49 and 50, which have no wheel for that runner).
          # Remove the flags once the Intel build moves to cryptography 50+.
          for f in pins/req-*.txt; do
            pip-audit -r "$f" --disable-pip --no-deps \
              --ignore-vuln PYSEC-2026-3552 \
              --ignore-vuln PYSEC-2026-3553 \
              --ignore-vuln PYSEC-2026-3554
          done

  # Secret scan of the working tree (not history). The gitleaks binary is pinned by version
  # and verified against a SHA-256 before it runs.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: gitleaks (working tree)
        run: |
          VER=8.30.1
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks dir . --redact --no-banner --exit-code 1

  # Portable snapshot files must open on the other OS: export a demo snapshot (plain and
  # encrypted) on macOS and on Windows, then import each on the other one.
  snapshot-export:
    name: Snapshot file export (${{ matrix.os }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: core/requirements-build.lock
      - run: |
          python -m pip install --require-hashes -r core/requirements-build.lock
          python -m pip install --no-deps -e core
      - run: python scripts/snapshot-roundtrip.py export snapshot-out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snapshot-${{ runner.os }}
          path: snapshot-out/
          if-no-files-found: error
          retention-days: 3

  snapshot-import:
    name: Snapshot file import (${{ matrix.from }} file on ${{ matrix.os }})
    needs: snapshot-export
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, from: macOS, platform: macos }
          - { os: macos-latest, from: Windows, platform: windows }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: core/requirements-build.lock
      - run: |
          python -m pip install --require-hashes -r core/requirements-build.lock
          python -m pip install --no-deps -e core
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: snapshot-${{ matrix.from }}
          path: snapshot-in
      - run: python scripts/snapshot-roundtrip.py import snapshot-in --expect-platform ${{ matrix.platform }}

  build:
    name: Package (${{ matrix.name }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64+arm64
            os: windows-latest
            artifact: NTNXVision-windows-msi
            files: |
              app/release/*.msi
          - name: macos-arm64
            os: macos-latest
            artifact: NTNXVision-macos-arm64
            files: |
              app/release/*.dmg
              app/release/*.zip
          - name: macos-x64
            os: macos-15-intel
            artifact: NTNXVision-macos-x64
            files: |
              app/release/*.dmg
              app/release/*.zip
    runs-on: ${{ matrix.os }}
    # Signing secrets live in the `release` GitHub Environment, which the repo owner restricts
    # to v* tags (see build/README.md). Only tag runs attach it; PR and manual builds attach
    # no environment, so they cannot read the secrets and stay unsigned.
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'release' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: core/requirements-build.lock

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      # electron-builder downloads Electron and (Windows) the WiX toolset; cache both.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/package-lock.json') }}

      # Signing secrets are exposed only to tag runs (environment `release`), never to pull
      # requests or manual runs (a PR or dispatched branch can change the scripts that run
      # here). Tag builds must be signed: they fail when any secret is absent. PR and manual
      # test builds are always unsigned.
      - name: Build (macOS)
        if: runner.os == 'macOS'
        env:
          # Exported to electron-builder names only when non-empty: an empty CSC_LINK makes
          # electron-builder treat "" as a certificate path and abort.
          SEC_CSC_LINK: ${{ startsWith(github.ref, 'refs/tags/') && secrets.MAC_CSC_LINK || '' }}
          SEC_CSC_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          SEC_APPLE_ID: ${{ startsWith(github.ref, 'refs/tags/') && secrets.APPLE_ID || '' }}
          SEC_APPLE_APP_SPECIFIC_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          SEC_APPLE_TEAM_ID: ${{ startsWith(github.ref, 'refs/tags/') && secrets.APPLE_TEAM_ID || '' }}
          REQUIRE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/') && 'true' || 'false' }}
        run: |
          if [ "$REQUIRE_SIGNING" = "true" ]; then
            for v in SEC_CSC_LINK SEC_CSC_KEY_PASSWORD SEC_APPLE_ID SEC_APPLE_APP_SPECIFIC_PASSWORD SEC_APPLE_TEAM_ID; do
              if [ -z "${!v}" ]; then
                echo "::error::Release builds must be signed and notarized: the secret behind $v is missing."
                exit 1
              fi
            done
          fi
          # Sign only with an explicitly provided certificate, never a runner keychain identity.
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          if [ -n "$SEC_CSC_LINK" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=true
            export CSC_LINK="$SEC_CSC_LINK" CSC_KEY_PASSWORD="$SEC_CSC_KEY_PASSWORD"
          fi
          if [ -n "$SEC_APPLE_ID" ]; then
            export APPLE_ID="$SEC_APPLE_ID"
            export APPLE_APP_SPECIFIC_PASSWORD="$SEC_APPLE_APP_SPECIFIC_PASSWORD"
            export APPLE_TEAM_ID="$SEC_APPLE_TEAM_ID"
          fi
          ./scripts/build-macos.sh --skip-tests

      - name: Build (Windows MSI)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SEC_WIN_CSC_LINK: ${{ startsWith(github.ref, 'refs/tags/') && secrets.WIN_CSC_LINK || '' }}
          SEC_WIN_CSC_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          REQUIRE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/') && 'true' || 'false' }}
        run: |
          if ($env:REQUIRE_SIGNING -eq 'true') {
            foreach ($v in 'SEC_WIN_CSC_LINK', 'SEC_WIN_CSC_KEY_PASSWORD') {
              if (-not [Environment]::GetEnvironmentVariable($v)) {
                Write-Host "::error::Release builds must be signed: the secret behind $v is missing."
                exit 1
              }
            }
          }
          $env:CSC_IDENTITY_AUTO_DISCOVERY = 'false'
          if ($env:SEC_WIN_CSC_LINK) {
            $env:WIN_CSC_LINK = $env:SEC_WIN_CSC_LINK
            $env:WIN_CSC_KEY_PASSWORD = $env:SEC_WIN_CSC_KEY_PASSWORD
          }
          ./scripts/build-windows.ps1 -SkipTests

      # Assert the Electron fuses actually flipped in the packaged app (not just configured).
      # GrantFileProtocolExtraPrivileges must be off: that needs the app:// renderer change
      # on the branch being built.
      - name: Verify Electron fuses on the packaged app
        shell: bash
        working-directory: app
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            APP=release/win-unpacked/NTNXVision.exe
          else
            apps=(release/mac*/NTNXVision.app)
            APP="${apps[0]}"
          fi
          out="$(npx --no-install electron-fuses read --app "$APP")"
          echo "$out"
          fail=0
          check() {
            if ! grep -Eq "^[[:space:]]*$1 is $2[[:space:]]*$" <<<"$out"; then
              echo "::error::Fuse $1 must be $2 in the packaged app."
              fail=1
            fi
          }
          check RunAsNode Disabled
          check EnableNodeOptionsEnvironmentVariable Disabled
          check EnableNodeCliInspectArguments Disabled
          check EnableEmbeddedAsarIntegrityValidation Enabled
          check OnlyLoadAppFromAsar Enabled
          check EnableCookieEncryption Enabled
          check GrantFileProtocolExtraPrivileges Disabled
          exit $fail

      - name: Ping the sidecar bundled inside the packaged app
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN=app/release/win-unpacked/resources/sidecar/ntnxvision-sidecar.exe
          else
            apps=(app/release/mac*/NTNXVision.app)
            BIN="${apps[0]}/Contents/Resources/sidecar/ntnxvision-sidecar"
          fi
          python scripts/smoke-sidecar.py "$BIN" --ping-only

      - name: List installers
        shell: bash
        run: ls -l app/release/

      # On tags the release job downloads these, so an upload failure must fail the build.
      # Elsewhere (PR / manual test builds) artifact storage on this repo has hit a stuck
      # "quota" error before; never let an upload hiccup fail an otherwise good build.
      - name: Upload installers (workflow artifact)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  # Tags only: collect every installer, checksum them, attest provenance and create the draft
  # GitHub Release. The only job with a write-scoped token.
  release:
    name: Publish draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the draft release
      id-token: write       # sign the provenance attestation
      attestations: write   # store the attestation
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: NTNXVision-*
          path: dist-release
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist-release
        run: |
          ls -l
          sha256sum -- *.msi *.dmg *.zip > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist-release/*.msi
            dist-release/*.dmg
            dist-release/*.zip
      - name: Attach to draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: NTNXVision ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist-release/*.msi
            dist-release/*.dmg
            dist-release/*.zip
            dist-release/SHA256SUMS
