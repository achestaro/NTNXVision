name: Release

# Builds the Windows MSI and the macOS DMG/ZIP (arm64 + x64) with the one-command build
# scripts, smoke-tests the frozen sidecar and the packaged app on each OS, and uploads the
# installers. Tags (v*) additionally get a draft GitHub Release with every installer, a
# SHA256SUMS file and a build-provenance attestation.
#
# Runs only on pull requests into main (to catch issues before the merge), on release
# tags, and on demand (Actions > Release > Run workflow). Pushes to feature branches
# do not run it.
#
# Security model: the workflow token is read-only by default; only the `release` job (tags
# only) gets contents: write. Signing secrets live in the `release` Environment (restricted
# to v* tags) and are exposed only to tag builds, never to pull requests or manual runs. A tag
# build signs when every signing secret for its platform is present, builds unsigned (and
# the release says so) when none is, and fails when only some are (a misconfiguration). Every action is
# pinned by commit SHA (Dependabot keeps them current). Python build deps are installed from
# the hash-locked core/requirements-build.lock with --require-hashes.

on:
  pull_request:
    branches: ["main"]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  # Job graph (build/README.md "CI layout"): every job below starts at once. Packaging does
  # not wait for the tests; the quality gate is instead that the tag `release` job needs
  # every check, and that pull requests require every check to pass before a merge.

  # The core suite in four shards (whole test files, balanced by measured duration:
  # core/tests/sharding.py), each run with pytest-xdist on all of the runner's cores.
  # test_sharding.py proves every test file lands in exactly one shard.
  core-tests:
    name: Core tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: core/requirements-build.lock
      - name: Install the core (hash-locked)
        working-directory: core
        run: |
          python -m pip install --require-hashes -r requirements-build.lock
          python -m pip install --no-deps -e .
      # --durations lists the slowest tests, to refresh core/tests/shard-weights.json.
      - name: pytest (shard ${{ matrix.shard }}/4)
        working-directory: core
        env:
          SHARD: ${{ matrix.shard }}
        run: python -m pytest -q -n auto --shard "$SHARD/4" --durations=25

  app-checks:
    name: App lint, tests and audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # the version check diffs against the base branch
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: eslint
        working-directory: app
        run: |
          npm ci --ignore-scripts --no-audit --no-fund   # lint and unit tests need no native module
          npm run lint
      - name: Main-process unit tests
        working-directory: app
        run: npm test
      # Shipped code changed: the version must go up (and CHANGELOG.md must say why), so
      # every installed build tells which fixes and features it has. Dependabot PRs exempt.
      - name: Version raised for shipped changes
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-version-bump.mjs "origin/$BASE_REF"
      # Shipped (production) dependencies must have no high or critical advisories.
      - name: npm audit (production, high)
        working-directory: app
        run: npm audit --omit=dev --audit-level=high
      # The --omit=dev audit above skips electron itself (a devDependency, but shipped inside
      # the app), so the full tree is audited too, blocking at moderate. This relies on the
      # package.json override that removes the last moderate chain (global-agent): merge this
      # change after it, or this step fails on a tree that still has that advisory.
      - name: npm audit (full tree, moderate)
        working-directory: app
        run: npm audit --audit-level=moderate
      # The notices list the core's Python packages, so the core is installed for this step.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: core/requirements-build.lock
      - name: Install the core (hash-locked)
        working-directory: core
        run: |
          python -m pip install --require-hashes -r requirements-build.lock
          python -m pip install --no-deps -e .
      # Python deps float within ranges, so a new upstream release can legitimately drift the
      # file; flag it here (non-blocking). Each build regenerates the copy it ships.
      - name: Third-party notices up to date
        working-directory: app
        continue-on-error: true
        env:
          NTNXVISION_PYTHON: python
        run: npm run notices:check

  # The real app end to end in demo mode (scripts/e2e-demo.mjs): built Electron main and
  # renderer, the real Python sidecar from core/.venv, the synthetic estate, no network.
  app-e2e:
    name: App e2e (demo mode)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: core/requirements-build.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      # npm ci downloads the Electron binary (its install script); cache it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/electron
          key: electron-e2e-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/package-lock.json') }}
      - name: Core venv (hash-locked)
        working-directory: core
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements-build.lock
          .venv/bin/python -m pip install --no-deps -e .
      # The dev sidecar must answer a ping the way the app starts it (demo mode), before
      # the e2e run depends on it.
      - name: Ping the core sidecar
        working-directory: core
        env:
          NTNXVISION_DEMO: "1"
        run: |
          export NTNXVISION_DATA_DIR="$RUNNER_TEMP/ping-data"
          echo '{"jsonrpc":"2.0","id":1,"method":"ping","params":{}}' \
            | .venv/bin/python -m ntnxvision_core sidecar | tee "$RUNNER_TEMP/ping.json"
          grep -q '"pong": true' "$RUNNER_TEMP/ping.json"
      - name: e2e
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npm run e2e
      # Screenshots of every step so far plus app.log (everything the app and the sidecar
      # printed).
      - name: Upload e2e screenshots and app log (on failure)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots-and-log
          path: app/screenshots/
          if-no-files-found: ignore
          retention-days: 3

  # Keeps the long-standing required status check name: passes only when every core test
  # shard, the app checks and the e2e run passed (a skipped or cancelled one fails it).
  checks:
    name: Core tests + app lint
    if: always()
    needs: [core-tests, app-checks, app-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Every test and lint job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "core-tests, app-checks, app-e2e: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || { echo "::error::A test or lint job did not pass ($r)."; exit 1; }
          done

  # Known-vulnerability scan of every platform's pins in the hash-locked Python set that is
  # frozen into the sidecar. The lock holds per-platform pins (environment markers), and
  # pip-audit would evaluate the markers for this Ubuntu runner only, so the markers are
  # stripped and each distinct pin is audited. A package pinned twice (cryptography, fonttools)
  # is split across files because pip-audit rejects duplicate requirements in one file.
  # Fails on any advisory except the accepted blockers below.
  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install pip-audit==2.10.1
      - name: pip-audit (all platform pins)
        run: |
          # name==version only: markers, hashes and comments dropped.
          grep -E '^[A-Za-z0-9_.-]+==' core/requirements-build.lock \
            | sed -E 's/^([^ ]+==[^ ]+).*/\1/' > pins.txt
          mkdir pins
          awk -F'==' '{ n[$1]++; print > ("pins/req-" n[$1] ".txt") }' pins.txt
          # Accepted blockers (B-2): the Intel macOS pin cryptography==48.0.1 is affected by
          # these three advisories (fixed in 49 and 50, which have no wheel for that runner).
          # Remove the flags once the Intel build moves to cryptography 50+.
          for f in pins/req-*.txt; do
            pip-audit -r "$f" --disable-pip --no-deps \
              --ignore-vuln PYSEC-2026-3552 \
              --ignore-vuln PYSEC-2026-3553 \
              --ignore-vuln PYSEC-2026-3554
          done

  # Secret scan of the working tree (not history). The gitleaks binary is pinned by version
  # and verified against a SHA-256 before it runs.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: gitleaks (working tree)
        run: |
          VER=8.30.1
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks dir . --redact --no-banner --exit-code 1

  # Portable snapshot files must open on the other OS: export a demo snapshot (plain and
  # encrypted) on macOS and on Windows, then import each on the other one.
  snapshot-export:
    name: Snapshot file export (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: core/requirements-build.lock
      - run: |
          python -m pip install --require-hashes -r core/requirements-build.lock
          python -m pip install --no-deps -e core
      - run: python scripts/snapshot-roundtrip.py export snapshot-out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-${{ runner.os }}
          path: snapshot-out/
          if-no-files-found: error
          retention-days: 3

  snapshot-import:
    name: Snapshot file import (${{ matrix.from }} file on ${{ matrix.os }})
    needs: snapshot-export
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, from: macOS, platform: macos }
          - { os: macos-latest, from: Windows, platform: windows }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: core/requirements-build.lock
      - run: |
          python -m pip install --require-hashes -r core/requirements-build.lock
          python -m pip install --no-deps -e core
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snapshot-${{ matrix.from }}
          path: snapshot-in
      - run: python scripts/snapshot-roundtrip.py import snapshot-in --expect-platform ${{ matrix.platform }}

  build:
    name: Package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64+arm64
            os: windows-latest
            artifact: NTNXVision-windows-msi
            files: |
              app/release/*.msi
          - name: macos-arm64
            os: macos-latest
            artifact: NTNXVision-macos-arm64
            files: |
              app/release/*.dmg
              app/release/*.zip
          - name: macos-x64
            os: macos-15-intel
            artifact: NTNXVision-macos-x64
            files: |
              app/release/*.dmg
              app/release/*.zip
    runs-on: ${{ matrix.os }}
    # Signing secrets live in the `release` GitHub Environment, which the repo owner restricts
    # to v* tags (see build/README.md). Only tag runs attach it; PR and manual builds attach
    # no environment, so they cannot read the secrets and stay unsigned.
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'release' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: core/requirements-build.lock

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      # electron-builder downloads Electron and (Windows) the WiX toolset; cache both.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/package-lock.json') }}

      # Signing secrets are exposed only to tag runs (environment `release`), never to pull
      # requests or manual runs (a PR or dispatched branch can change the scripts that run
      # here). Tag builds sign when all of their platform's secrets are present, stay unsigned
      # when none are, and fail on a partial set. PR and manual test builds are always unsigned.
      - name: Build (macOS)
        if: runner.os == 'macOS'
        env:
          # Exported to electron-builder names only when non-empty: an empty CSC_LINK makes
          # electron-builder treat "" as a certificate path and abort.
          SEC_CSC_LINK: ${{ startsWith(github.ref, 'refs/tags/') && secrets.MAC_CSC_LINK || '' }}
          SEC_CSC_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          SEC_APPLE_ID: ${{ startsWith(github.ref, 'refs/tags/') && secrets.APPLE_ID || '' }}
          SEC_APPLE_APP_SPECIFIC_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          SEC_APPLE_TEAM_ID: ${{ startsWith(github.ref, 'refs/tags/') && secrets.APPLE_TEAM_ID || '' }}
          REQUIRE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/') && 'true' || 'false' }}
        run: |
          if [ "$REQUIRE_SIGNING" = "true" ]; then
            set_count=0
            for v in SEC_CSC_LINK SEC_CSC_KEY_PASSWORD SEC_APPLE_ID SEC_APPLE_APP_SPECIFIC_PASSWORD SEC_APPLE_TEAM_ID; do
              [ -n "${!v}" ] && set_count=$((set_count + 1))
            done
            if [ "$set_count" -eq 0 ]; then
              echo "::warning::No macOS signing secrets: this release build is unsigned and not notarized."
            elif [ "$set_count" -ne 5 ]; then
              echo "::error::Only some macOS signing secrets are set ($set_count of 5): add all of them or none."
              exit 1
            fi
          fi
          # Sign only with an explicitly provided certificate, never a runner keychain identity.
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          if [ -n "$SEC_CSC_LINK" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=true
            export CSC_LINK="$SEC_CSC_LINK" CSC_KEY_PASSWORD="$SEC_CSC_KEY_PASSWORD"
          fi
          if [ -n "$SEC_APPLE_ID" ]; then
            export APPLE_ID="$SEC_APPLE_ID"
            export APPLE_APP_SPECIFIC_PASSWORD="$SEC_APPLE_APP_SPECIFIC_PASSWORD"
            export APPLE_TEAM_ID="$SEC_APPLE_TEAM_ID"
          fi
          ./scripts/build-macos.sh --skip-tests

      - name: Build (Windows MSI)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SEC_WIN_CSC_LINK: ${{ startsWith(github.ref, 'refs/tags/') && secrets.WIN_CSC_LINK || '' }}
          SEC_WIN_CSC_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          REQUIRE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/') && 'true' || 'false' }}
        run: |
          if ($env:REQUIRE_SIGNING -eq 'true') {
            $setCount = @('SEC_WIN_CSC_LINK', 'SEC_WIN_CSC_KEY_PASSWORD' | Where-Object { [Environment]::GetEnvironmentVariable($_) }).Count
            if ($setCount -eq 0) {
              Write-Host "::warning::No Windows signing secrets: this release build is unsigned."
            } elseif ($setCount -ne 2) {
              Write-Host "::error::Only some Windows signing secrets are set ($setCount of 2): add both or none."
              exit 1
            }
          }
          $env:CSC_IDENTITY_AUTO_DISCOVERY = 'false'
          if ($env:SEC_WIN_CSC_LINK) {
            $env:WIN_CSC_LINK = $env:SEC_WIN_CSC_LINK
            $env:WIN_CSC_KEY_PASSWORD = $env:SEC_WIN_CSC_KEY_PASSWORD
          }
          ./scripts/build-windows.ps1 -SkipTests

      # Assert the Electron fuses actually flipped in the packaged app (not just configured).
      # GrantFileProtocolExtraPrivileges must be off: that needs the app:// renderer change
      # on the branch being built.
      - name: Verify Electron fuses on the packaged app
        shell: bash
        working-directory: app
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            APP=release/win-unpacked/NTNXVision.exe
          else
            apps=(release/mac*/NTNXVision.app)
            APP="${apps[0]}"
          fi
          out="$(npx --no-install electron-fuses read --app "$APP")"
          echo "$out"
          fail=0
          check() {
            if ! grep -Eq "^[[:space:]]*$1 is $2[[:space:]]*$" <<<"$out"; then
              echo "::error::Fuse $1 must be $2 in the packaged app."
              fail=1
            fi
          }
          check RunAsNode Disabled
          check EnableNodeOptionsEnvironmentVariable Disabled
          check EnableNodeCliInspectArguments Disabled
          check EnableEmbeddedAsarIntegrityValidation Enabled
          check OnlyLoadAppFromAsar Enabled
          check EnableCookieEncryption Enabled
          check GrantFileProtocolExtraPrivileges Disabled
          exit $fail

      # --ping-only still runs the --tls-check trust store self-check (no network).
      - name: Ping the sidecar bundled inside the packaged app
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN=app/release/win-unpacked/resources/sidecar/ntnxvision-sidecar.exe
          else
            apps=(app/release/mac*/NTNXVision.app)
            BIN="${apps[0]}/Contents/Resources/sidecar/ntnxvision-sidecar"
          fi
          python scripts/smoke-sidecar.py "$BIN" --ping-only

      - name: List installers
        shell: bash
        run: ls -l app/release/

      # On tags the release job downloads these, so an upload failure must fail the build.
      # Elsewhere (PR / manual test builds) artifact storage on this repo has hit a stuck
      # "quota" error before; never let an upload hiccup fail an otherwise good build.
      - name: Upload installers (workflow artifact)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  # Tags only: collect every installer, checksum them, attest provenance and create the draft
  # GitHub Release. The only job with a write-scoped token. It needs every check, not just
  # the builds (which run alongside the tests): nothing is published unless all passed.
  release:
    name: Publish draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - checks
      - core-tests
      - app-checks
      - app-e2e
      - python-audit
      - secret-scan
      - snapshot-export
      - snapshot-import
      - build
    runs-on: ubuntu-latest
    # Attached only to read whether signing secrets exist, so the release can say so.
    environment: release
    permissions:
      contents: write       # create the draft release
      id-token: write       # sign the provenance attestation
      attestations: write   # store the attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: NTNXVision-*
          path: dist-release
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist-release
        run: |
          ls -l
          sha256sum -- *.msi *.dmg *.zip > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist-release/*.msi
            dist-release/*.dmg
            dist-release/*.zip
      - name: Signing note
        env:
          MAC_SIGNED: ${{ secrets.MAC_CSC_LINK != '' && secrets.APPLE_ID != '' }}
          WIN_SIGNED: ${{ secrets.WIN_CSC_LINK != '' }}
        run: |
          {
            if [ "$MAC_SIGNED" = "true" ] && [ "$WIN_SIGNED" = "true" ]; then
              echo "Installers are code-signed (Windows) and signed and notarized (macOS)."
            else
              echo "## Unsigned build"
              echo
              echo "These installers are not code-signed yet, so the first launch shows a warning."
              echo
              echo "- **macOS**: after copying NTNXVision to Applications, run \`xattr -cr /Applications/NTNXVision.app\` once, then open it."
              echo "- **Windows**: if SmartScreen says \"Windows protected your PC\", choose **More info**, then **Run anyway**."
              echo
              echo "Check a download against \`SHA256SUMS\` and the build provenance attestation (\`gh attestation verify <file> -R ${GITHUB_REPOSITORY}\`)."
            fi
          } > release-notes.md
          cat release-notes.md
      - name: Attach to draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: NTNXVision ${{ github.ref_name }}
          draft: true
          body_path: release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist-release/*.msi
            dist-release/*.dmg
            dist-release/*.zip
            dist-release/SHA256SUMS
