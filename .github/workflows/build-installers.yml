name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: NTNXVision-windows-installer
            glob: app/release/*.exe
          - os: macos-latest
            artifact: NTNXVision-macos-dmg
            glob: app/release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Freeze Python sidecar
        working-directory: core
        run: |
          pip install -e ".[dev]"
          pyinstaller build/ntnxvision-sidecar.spec

      - name: Smoke-test frozen sidecar
        shell: bash
        working-directory: core
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"ping","params":{}}' \
            | ./dist/ntnxvision-sidecar/ntnxvision-sidecar* | grep '"pong": true'

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Package Electron app
        shell: bash
        working-directory: app
        env:
          # macOS Developer ID signing + notarization — all optional secrets. They are
          # exported to electron-builder names below ONLY when non-empty: an empty
          # CSC_LINK makes electron-builder treat "" as a cert path and abort.
          SEC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          SEC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          SEC_APPLE_ID: ${{ secrets.APPLE_ID }}
          SEC_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SEC_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Never scan the runner keychain; sign only with an explicitly provided cert.
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          if [ -n "$SEC_CSC_LINK" ]; then
            export CSC_LINK="$SEC_CSC_LINK" CSC_KEY_PASSWORD="$SEC_CSC_KEY_PASSWORD"
          fi
          if [ -n "$SEC_APPLE_ID" ]; then
            export APPLE_ID="$SEC_APPLE_ID"
            export APPLE_APP_SPECIFIC_PASSWORD="$SEC_APPLE_APP_SPECIFIC_PASSWORD"
            export APPLE_TEAM_ID="$SEC_APPLE_TEAM_ID"
          fi
          npm ci
          npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error
