<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP allows the Vite dev server (http/ws on localhost) for hot-reload in development.
      In a packaged build the renderer loads from file:// and only 'self' applies, so the
      localhost allowances are inert. No remote origins are permitted.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' 'unsafe-inline' http://localhost:5273 ws://localhost:5273; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' http://localhost:5273"
    />
    <title>NTNXVision</title>
    <link rel="icon" type="image/svg+xml" href="./assets/logo.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
